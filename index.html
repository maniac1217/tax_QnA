<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관심사 높은 양도소득세 종합 진단</title>
    <style>
        /* 어르신 시인성을 위한 큼직한 CSS 설계 */
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f7f6;
            color: #222;
            margin: 0;
            padding: 20px;
            font-size: 24px; /* 기본 글자 크기 대폭 확대 */
            line-height: 1.6;
        }
        #app-container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 36px;
            margin-bottom: 30px;
            border-bottom: 3px solid #2b6cb0;
            padding-bottom: 15px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        /* 홀수 개수일 때 마지막 버튼을 가로 전체 차지하게 함 */
        .menu-grid button:last-child:nth-child(odd) {
            grid-column: 1 / -1;
        }
        .menu-btn {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 20px 15px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            word-break: keep-all;
        }
        .menu-btn:hover, .menu-btn.active {
            background-color: #1a365d;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .section {
            display: none;
            padding: 25px;
            background-color: #ebf8ff;
            border: 2px solid #90cdf4;
            border-radius: 12px;
        }
        .section.active {
            display: block;
        }
        h2 {
            color: #2c5282;
            font-size: 30px;
            border-bottom: 2px dashed #cbd5e0;
            padding-bottom: 10px;
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 25px;
            font-weight: bold;
            color: #2d3748;
        }
        input[type="number"], select {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            font-size: 24px;
            border: 2px solid #a0aec0;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .action-btn {
            width: 100%;
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 22px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 35px;
            cursor: pointer;
        }
        .action-btn:hover {
            background-color: #c53030;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            background-color: #fffaf0;
            border: 3px solid #ed8936;
            border-radius: 10px;
            font-size: 26px;
            font-weight: bold;
            color: #c05621;
            display: none;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            font-size: 26px;
            margin-top: 20px;
            font-weight: normal;
            cursor: pointer;
        }
        .checkbox-label input {
            width: 35px;
            height: 35px;
            margin-right: 15px;
            cursor: pointer;
        }
        .tip {
            font-size: 20px;
            color: #4a5568;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <h1> 양도소득세 진단</h1>
    
    <div class="menu-grid">
        <button class="menu-btn" onclick="showSection('sec1', this)">1. 다주택자<br>(파는 순서 & 장기보유)</button>
        <button class="menu-btn" onclick="showSection('sec2', this)">2. 비사업용 토지<br>(세금 중과 계산)</button>
        <button class="menu-btn" onclick="showSection('sec3', this)">3. 1세대 1주택<br>(비과세 조건)</button>
        <button class="menu-btn" onclick="showSection('sec4', this)">4. 농어촌 주택<br>(시골집 혜택)</button>
        <button class="menu-btn" onclick="showSection('sec5', this)">5. 분양권/입주권<br>(주택수 포함 여부)</button>
        <button class="menu-btn" onclick="showSection('sec6', this)">6. 일시적 2주택<br>(갈아타기 혜택)</button>
        <button class="menu-btn" onclick="showSection('sec7', this)">7. 필요경비<br>(수리비 인정 범위)</button>
    </div>

    <div id="sec1" class="section">
        <h2>어떤 집을 먼저 팔까요? (장기보유 혜택)</h2>
        <label>A 주택 예상 남는 돈(양도차익) (만원)</label>
        <input type="number" id="profitA" placeholder="예: 5000">
        <label>B 주택 예상 남는 돈(양도차익) (만원)</label>
        <input type="number" id="profitB" placeholder="예: 20000">
        
        <label class="checkbox-label">
            <input type="checkbox" id="longTermCheck"> 파는 집을 3년 이상 보유하셨습니까?
        </label>
        
        <button class="action-btn" onclick="checkOrder()">순서 및 공제 확인하기</button>
        <div id="result1" class="result-box"></div>
    </div>

    <div id="sec2" class="section">
        <h2>비사업용 토지 (농사 안 짓는 땅)</h2>
        <label>토지 팔아서 남는 돈(양도차익) (만원)</label>
        <input type="number" id="landProfit" placeholder="예: 10000">
        <button class="action-btn" onclick="calcLandTax()">추가 세금 계산하기</button>
        <div id="result2" class="result-box"></div>
    </div>

    <div id="sec3" class="section">
        <h2>1세대 1주택 비과세 (세금 0원 조건)</h2>
        <label>집을 파는 가격 (만원)</label>
        <input type="number" id="salePrice" placeholder="예: 90000 (9억)">
        <label>보유 및 거주 요건</label>
        <select id="holdingPeriod">
            <option value="fail">2년 미만 보유</option>
            <option value="pass">2년 이상 보유 (조정지역은 2년 거주 완료)</option>
        </select>
        <button class="action-btn" onclick="checkExemption()">비과세 확인하기</button>
        <div id="result3" class="result-box"></div>
    </div>

    <div id="sec4" class="section">
        <h2>시골집(농어촌 주택) 주택수 제외 혜택</h2>
        <label class="checkbox-label"><input type="checkbox" id="r1"> 읍, 면 등 시골 지역에 있습니까?</label>
        <label class="checkbox-label"><input type="checkbox" id="r2"> 살 때 집값이 3억 원(한옥 4억) 이하입니까?</label>
        <label class="checkbox-label"><input type="checkbox" id="r3"> 기존 도시 집을 먼저 사고, 나중에 시골집을 사셨습니까?</label>
        <button class="action-btn" onclick="checkRural()">혜택 가능 여부 확인</button>
        <div id="result4" class="result-box"></div>
    </div>

    <div id="sec5" class="section">
        <h2>분양권과 입주권, 내 집(주택 수)에 포함될까?</h2>
        <label>가지고 계신 권리는 무엇인가요?</label>
        <select id="rightType">
            <option value="member">조합원 입주권 (재건축/재개발)</option>
            <option value="pre_before">분양권 (2020년 12월 31일 이전 취득)</option>
            <option value="pre_after">분양권 (2021년 1월 1일 이후 취득)</option>
        </select>
        <button class="action-btn" onclick="checkRights()">주택 수 포함 확인하기</button>
        <div id="result5" class="result-box"></div>
    </div>

    <div id="sec6" class="section">
        <h2>이사 갈 때 혜택 (일시적 2주택)</h2>
        <p class="tip">새 집을 사고 기존 집을 언제까지 팔아야 할까요?</p>
        <label>새 집을 사고 나서, 기존 집을 몇 년 안에 파시나요?</label>
        <select id="movePeriod">
            <option value="within3">3년 이내에 팝니다</option>
            <option value="over3">3년이 지나서 팝니다</option>
        </select>
        <button class="action-btn" onclick="checkMove()">갈아타기 혜택 확인</button>
        <div id="result6" class="result-box"></div>
    </div>

    <div id="sec7" class="section">
        <h2>집 수리비, 세금 줄일 때 인정받을 수 있을까?</h2>
        <p class="tip">집의 가치를 높인 '자본적 지출'만 인정됩니다. (영수증 필수)</p>
        <label class="checkbox-label"><input type="checkbox" id="exp1" value="O"> 베란다 샤시(창틀) 교체, 보일러 교체</label>
        <label class="checkbox-label"><input type="checkbox" id="exp2" value="O"> 방 확장 공사, 상하수도 배관 교체</label>
        <label class="checkbox-label"><input type="checkbox" id="exp3" value="O"> 부동산 복비(중개수수료), 취득세, 법무사 비용</label>
        <label class="checkbox-label"><input type="checkbox" id="exp4" value="X"> 벽지, 장판 교체, 문짝 페인트칠</label>
        <label class="checkbox-label"><input type="checkbox" id="exp5" value="X"> 싱크대 교체, 주방 타일 교체</label>
        <button class="action-btn" onclick="checkExpense()">비용 인정 확인하기</button>
        <div id="result7" class="result-box"></div>
    </div>

</div>

<script>
    // 메뉴 전환
    function showSection(secId, btn) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(secId).classList.add('active');
        btn.classList.add('active');
        document.querySelectorAll('.result-box').forEach(el => el.style.display = 'none');
    }

    // 1. 다주택자 & 장특공제
    function checkOrder() {
        const a = Number(document.getElementById('profitA').value);
        const b = Number(document.getElementById('profitB').value);
        const isLongTerm = document.getElementById('longTermCheck').checked;
        const res = document.getElementById('result1');
        
        if(a === 0 || b === 0) { res.innerHTML = "A주택과 B주택의 양도차익을 모두 입력해주세요."; res.style.display = 'block'; return; }
        
        let msg = "";
        if (a < b) msg = "💡 차익이 적은 <strong>[A 주택]</strong>을 먼저 파시는 것이 좋습니다.<br>그래야 가장 돈이 많이 남는 B 주택을 마지막에 세금 없이(비과세) 팔 수 있습니다.";
        else if (a > b) msg = "💡 차익이 적은 <strong>[B 주택]</strong>을 먼저 파시는 것이 좋습니다.<br>그래야 가장 돈이 많이 남는 A 주택을 마지막에 세금 없이(비과세) 팔 수 있습니다.";
        else msg = "두 주택의 남는 돈이 같습니다. 어느 것을 먼저 파셔도 무방합니다.";

        if(isLongTerm) msg += "<hr>✅ <strong>장기보유특별공제 적용:</strong><br>3년 이상 보유하셨으므로, 물가 상승분을 감안해 세금을 깎아주는 혜택을 받습니다. (다주택자는 연 2%, 최대 30%)";
        else msg += "<hr>⚠️ <strong>장기보유특별공제 불가:</strong><br>보유기간이 3년 미만이라 장기보유 혜택은 받을 수 없습니다.";
        
        res.innerHTML = msg;
        res.style.display = 'block';
    }

    // 2. 비사업용 토지
    function calcLandTax() {
        const profit = Number(document.getElementById('landProfit').value);
        const res = document.getElementById('result2');
        if(profit === 0) { res.innerHTML = "양도차익을 입력해주세요."; res.style.display = 'block'; return; }
        
        const normalTax = Math.floor(profit * 0.24); 
        const penaltyTax = Math.floor(profit * 0.34);
        const diff = penaltyTax - normalTax;
        
        res.innerHTML = "⚠️ <strong>비사업용 토지 벌칙 안내</strong><br>농사를 짓지 않은 땅은 세금 벌칙(중과세 10%)이 붙습니다.<br><br>" +
                        "- 일반 땅 세금: 약 " + normalTax.toLocaleString() + "만 원<br>" +
                        "- 비사업용 세금: 약 " + penaltyTax.toLocaleString() + "만 원<br><br>" +
                        "👉 <strong>약 " + diff.toLocaleString() + "만 원을 더 내셔야 합니다.</strong>";
        res.style.display = 'block';
    }

    // 3. 1세대 1주택
    function checkExemption() {
        const price = Number(document.getElementById('salePrice').value);
        const period = document.getElementById('holdingPeriod').value;
        const res = document.getElementById('result3');
        
        if(price === 0) { res.innerHTML = "가격을 입력해주세요."; res.style.display = 'block'; return; }
        
        if (period === 'fail') {
            res.innerHTML = "❌ <strong>비과세 안 됨</strong><br>2년을 채우지 못하셨습니다. 2년을 꽉 채우고 파셔야 세금을 안 냅니다.";
        } else if (price <= 120000) {
            res.innerHTML = "🎉 <strong>세금 0원 (전액 비과세)</strong><br>2년 요건을 채우셨고 12억 원 이하이므로 양도소득세는 한 푼도 내지 않습니다.";
        } else {
            res.innerHTML = "⚠️ <strong>일부 세금 발생 (고가주택)</strong><br>12억 원까지는 세금이 없고, <strong>12억을 넘는 금액(" + (price - 120000).toLocaleString() + "만 원)</strong>에 대해서만 세금을 계산합니다.<br>*단, 거주기간이 길수록 장기보유특별공제(최대 80%)를 많이 받아 세금이 뚝 떨어집니다.";
        }
        res.style.display = 'block';
    }

    // 4. 농어촌 주택
    function checkRural() {
        const r1 = document.getElementById('r1').checked;
        const r2 = document.getElementById('r2').checked;
        const r3 = document.getElementById('r3').checked;
        const res = document.getElementById('result4');
        
        if (r1 && r2 && r3) {
            res.innerHTML = "🎉 <strong>시골집 주택수 제외 성공!</strong><br>도시 집을 파실 때 이 시골집은 없는 것으로 쳐줍니다. 따라서 도시 집은 1주택 혜택을 받습니다.";
        } else {
            res.innerHTML = "❌ <strong>조건 미달</strong><br>체크하지 않은 조건이 있어 시골집도 주택 수에 들어갑니다. 다주택자가 될 수 있으니 주의하세요.";
        }
        res.style.display = 'block';
    }

    // 5. 분양권/입주권
    function checkRights() {
        const type = document.getElementById('rightType').value;
        const res = document.getElementById('result5');
        
        if(type === 'member') {
            res.innerHTML = "⚠️ <strong>주택 수에 포함됩니다.</strong><br>조합원 입주권은 원래 내 집이었으므로 다른 집을 팔 때 주택 수에 1채로 계산됩니다.";
        } else if (type === 'pre_before') {
            res.innerHTML = "✅ <strong>주택 수에 포함되지 않습니다.</strong><br>2020년 12월 31일 이전에 사신 분양권은 권리로만 봅니다. (세금 계산 시 집 개수에서 빠짐)";
        } else {
            res.innerHTML = "⚠️ <strong>주택 수에 포함됩니다.</strong><br>세법이 바뀌어 <strong>2021년 1월 1일 이후에 취득한 분양권</strong>은 다른 집을 팔 때 주택 수 1채로 똑같이 계산됩니다.";
        }
        res.style.display = 'block';
    }

    // 6. 일시적 2주택
    function checkMove() {
        const period = document.getElementById('movePeriod').value;
        const res = document.getElementById('result6');
        
        if(period === 'within3') {
            res.innerHTML = "🎉 <strong>일시적 2주택 비과세 가능!</strong><br>새 집을 사고 <strong>3년 이내에 옛날 집을 파시므로</strong> 옛날 집은 1주택자로 인정받아 세금을 내지 않습니다.<br><span style='font-size:20px; color:#4a5568;'>(단, 옛날 집을 샀던 날부터 1년이 지난 후에 새 집을 샀어야 합니다.)</span>";
        } else {
            res.innerHTML = "❌ <strong>특례 기간 지남</strong><br>새 집을 사고 3년이 지나서 옛날 집을 파시면 <strong>다주택자</strong>로 세금을 내셔야 합니다. 파실 계획이라면 3년 기한을 꼭 지키세요.";
        }
        res.style.display = 'block';
    }

    // 7. 필요경비
    function checkExpense() {
        const res = document.getElementById('result7');
        let msg = "💡 <strong>체크하신 항목의 수리비 인정 결과:</strong><br><ul style='text-align:left; font-size:24px;'>";
        let checkedAny = false;
        
        for(let i=1; i<=5; i++){
            let el = document.getElementById('exp' + i);
            if(el.checked) {
                checkedAny = true;
                let text = el.parentElement.innerText.trim();
                if(el.value === 'O') {
                    msg += "<li style='color:blue; margin-bottom:10px;'>✅ <strong>[인정 됨]</strong> " + text + " (영수증 필수)</li>";
                } else {
                    msg += "<li style='color:red; margin-bottom:10px;'>❌ <strong>[인정 안됨]</strong> " + text + " (단순 유지보수로 보아 안 해줌)</li>";
                }
            }
        }
        msg += "</ul><br>👉 <strong>기억하세요:</strong> 집 구조를 바꾸거나 가치를 확 높이는 큰 공사만 인정되고, 낡아서 원래대로 고치는 인테리어(도배, 장판, 싱크대)는 인정되지 않습니다.";
        
        if(!checkedAny) {
            res.innerHTML = "궁금하신 수리 항목을 체크해 주세요.";
        } else {
            res.innerHTML = msg;
        }
        res.style.display = 'block';
    }
</script>

</body>
</html>
